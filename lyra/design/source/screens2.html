<body style="margin:0;background:#888">
<script>
// Lyra e-ink screens, 400 x 300 px, drawn as vector SVG.
// Black, white and one grey (#8f8d86), which a 1-bit panel shows as a 50% dither.
const INK = '#1b1b1b', PAPER = '#e8e7e1';

let ctx = new SvgCtx();
const DEFS = '';
function svgDoc(id, w = 400, h = 300) { return `<svg xmlns="http://www.w3.org/2000/svg" id="${id}" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${DEFS}${ctx.out.join('')}</svg>`; }

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function ln(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function circ(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); fill ? ctx.fill() : ctx.stroke(); }
function ell(x, y, rx, ry, rot, fill) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); fill ? ctx.fill() : ctx.stroke(); }
function pen(col, w) { ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = w; }
function check(x, y, s, col = INK) { pen(col, s * 0.16); ctx.beginPath(); ctx.moveTo(x - s * .42, y + s * .02); ctx.lineTo(x - s * .12, y + s * .32); ctx.lineTo(x + s * .45, y - s * .3); ctx.stroke(); }

// ---------------------------------------------------------------- form icons
// Each is drawn inside a box of height s centred on (x, y), in one colour.
function zigEdge(x1, x2, y, t, down) { const n = Math.max(3, Math.round((x2 - x1) / (t * 1.6))), st = (x2 - x1) / n; for (let i = 0; i < n; i++) { ctx.lineTo(x1 + st * (i + .5), y + (down ? t : -t)); ctx.lineTo(x1 + st * (i + 1), y); } }

const ICON = [sachet, blister, stickDrops, bottle];
const NAME = ['약봉투', '블리스터', '스틱·안약', '영양제'];

function slotIcon(k, x, y, r, col = INK) { // 0 morning 1 noon 2 evening 3 night
  pen(col, Math.max(2, r / 7));
  if (k === 0) { ctx.beginPath(); ctx.arc(x, y + r * .3, r * .5, Math.PI, 0); ctx.fill(); ln(x - r, y + r * .3, x + r, y + r * .3); [-.85, -.5, -.15].forEach((a) => { const t = a * Math.PI; ln(x + Math.cos(t) * r * .72, y + r * .3 + Math.sin(t) * r * .72, x + Math.cos(t) * r, y + r * .3 + Math.sin(t) * r); }); }

const SLOT = ['아침', '점심', '저녁', '자기 전'];
function weather(sky, x, y, r) {

// ---------------------------------------------------------------- tiles
// The 2x2 map: tile c sits where compartment c sits (1 2 / 3 4).
function tile(c, st, x, y, w, h, o = {}) {

    pen(INK, 2.5); rr(x + 1.25, y + 1.25, w - 2.5, h - 2.5, 10); ctx.stroke();
    ICON[c](ix, iy, s * .9, INK);
    num(String(c + 1), x + w - 12, y + 22, 16, 700, 'right');
    check(x + w * .76, y + h * .44, Math.min(34, h * .34));

    pen(INK, 2.5); rr(x + 1.25, y + 1.25, w - 2.5, h - 2.5, 10); ctx.stroke();

function grid(states, x, y, w, h, gap = 8, o = {}) {

function header(k, label, time) {
  if (k >= 0) slotIcon(k, 30, 24, 16);
  txt(label, k >= 0 ? 56 : 16, 34, 24, 900);
  if (time) num(time, 386, 32, 19, 700, 'right');
}

// ---------------------------------------------------------------- screens

  for (let i = 0; i < 4; i++) { pen(INK, 2); circ(304 + i * 25, 178, 8.5, i < dust); }
  if (mask) txt('외출 시 마스크', 24, 208, 13, 700);
  pen(INK, 1.5); ln(16, 222, 384, 222);
  if (done) { check(34, 258, 26); txt('오늘 약 끝', 58, 267, 20, 900); if (tomorrow) { txt('내일', 318, 266, 14, 500, 'right'); num(tomorrow, 384, 267, 20, 700, 'right'); } return; }

  mini(nextMap, 334, 240);

function nearNext({ time, k, at, left, map }) {
  num(time, 386, 32, 19, 700, 'right');
  txt('다음 약', 22, 58, 18, 700);
  slotIcon(k, 38, 102, 18); txt(SLOT[k], 64, 112, 26, 900);
  num(at, 20, 188, 60, 800);
  txt(left, 24, 224, 18, 500);

// ---------------------------------------------------------------- concepts B and C
function ring(cx, cy, r, now, doses) { // 24-hour ring, midnight at top
  const ang = (m) => -Math.PI / 2 + (m / 1440) * Math.PI * 2;
  pen(INK, 1.5); ctx.setLineDash([2, 4]); circ(cx, cy, r, false); ctx.setLineDash([]);
  pen(INK, 6); ctx.beginPath(); ctx.arc(cx, cy, r, ang(0), ang(now)); ctx.stroke();
  for (const [k, m, st] of doses) {
    const a = ang(m), x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    ctx.fillStyle = st === 'done' ? INK : PAPER; pen(INK, 2.5); circ(x, y, 9, false); ctx.fillStyle = st === 'done' ? INK : PAPER; circ(x, y, 7.5, true);
    if (st === 'done') check(x, y + 1, 9, PAPER);
    if (st === 'due') { ctx.fillStyle = INK; circ(x, y, 7.5, true); }
    slotIcon(k, cx + Math.cos(a) * (r + 24), cy + Math.sin(a) * (r + 24), 9);
  }
  const a = ang(now); pen(INK, 2); ln(cx + Math.cos(a) * (r - 14), cy + Math.sin(a) * (r - 14), cx + Math.cos(a) * (r + 10), cy + Math.sin(a) * (r + 10));
}
